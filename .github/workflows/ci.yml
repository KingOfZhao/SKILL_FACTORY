name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check skill_factory tests

      - name: Ruff format check
        run: python -m ruff format --check skill_factory tests

      - name: Mypy type check
        run: python -m mypy

      - name: Pytest + coverage
        run: python -m pytest --cov=skill_factory --cov-report=term-missing

      - name: Skill catalog drift gate
        run: python -m skill_factory.cli scan --check
